{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sample-api.fullname" . }}-ingress-only
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sample-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        {{- toYaml .Values.networkPolicy.ports | nindent 8 }}
{{- end }}


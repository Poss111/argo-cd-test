apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-api.fullname" . }}-runtime
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
data:
  ui-message: {{ .Values.runtimeConfig.uiMessage | quote }}
  log-level: {{ .Values.runtimeConfig.logLevel | quote }}
  feature-preview: {{ .Values.runtimeConfig.featurePreview | quote }}


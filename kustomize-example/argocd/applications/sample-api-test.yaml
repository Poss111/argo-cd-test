apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-test
  namespace: argocd
  labels:
    app.kubernetes.io/name: sample-api
    environment: test
spec:
  project: sample-platform
  source:
    repoURL: https://github.com/your-org/argo-cd-test.git
    targetRevision: HEAD
    path: apps/sample-api/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true


apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-api-prod
nameSuffix: -prod
labels:
  - pairs:
      environment: prod
    includeSelectors: true
resources:
  - ../../base
  - runtime-config.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
patches:
  - path: deployment-patch.yaml
